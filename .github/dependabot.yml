version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/client"
    schedule:
      interval: "weekly"
    groups:
      docker-client:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      docker-server:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    groups:
      client-npm:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      server-nuget:
        patterns:
          - "*"
