name: CD pipeline (server)

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - "server/**"
            # Changes only to these files don't trigger CD:
            # docs
            - "!server/**/*.md"
            # unit test csproj
            - "!server/PutWiki.UnitTests/**"
            # environment variables (example files)
            - "!server/.env*"
            # linter, formatter
            - "!server/.editorconfig"
            - "!server/**/*.ruleset"
            - "!server/sonar-project.properties"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    packages: write

jobs:
    release-server:
        runs-on: ubuntu-22.04-arm

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  
            - name: Setup .NET
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
              with:
                  global-json-file: server/global.json
                  
            - name: Generate migration SQL script
              run: |
                 cd server
                 dotnet tool restore
                 dotnet restore PutWiki.slnx --locked-mode
                
                 dotnet ef migrations script -i -o ../migration.sql \
                    --project Infrastructure/Infrastructure.csproj \
                    --startup-project Presentation/Presentation.csproj

            - name: Determine next version
              id: next_version
              uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DEFAULT_BUMP: patch
                  INITIAL_VERSION: 0.1.2
                  TAG_PREFIX: server-v
                  DRY_RUN: true

            - name: Login to GHCR
              uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup QEMU
              uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

            - name: Set lowercase repository name
              run: |
                echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

            - name: Build and push server image
              uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
              with:
                  context: ./server
                  platforms: linux/arm64
                  push: true
                  tags: |
                      ghcr.io/${{ env.REPO }}/server:${{ steps.next_version.outputs.new_tag }}
                      ghcr.io/${{ env.REPO }}/server:latest

            - name: Create tag
              uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CUSTOM_TAG: ${{ steps.next_version.outputs.new_tag }}

            - name: Create GitHub Release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              with:
                  tag_name: ${{ steps.next_version.outputs.new_tag }}
                  name: Release ${{ steps.next_version.outputs.new_tag }}
                  generate_release_notes: true
                  files: migration.sql
