name: CI pipeline

permissions: 
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            client:
              - 'client/**'
              - '!**/*.md'
            server:
              - 'server/**'
              - '!**/*.md'
  
  client-verification:
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: client/package.json
      
      - name: Install dependencies
        run: bun ci

      - name: Check formatting
        run: bun run format:check
        
      - name: Check linting
        run: bun run lint:check
        
      - name: Build client and check types
        run: bun run build
        
      - name: Perform unit tests
        run: bun run test:unit

  server-verification:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: server/global.json
          
      - name: Restore dependencies
        run: dotnet restore PutWiki.slnx --locked-mode 
        
      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet format PutWiki.slnx --verify-no-changes --verbosity diagnostic
      
      - name: Build and lint
        run: dotnet build PutWiki.slnx --configuration Release --no-restore

      - name: Check whether new migration should be added
        run: dotnet ef migrations has-pending-model-changes --project Infrastructure/Infrastructure.csproj --startup-project Presentation/Presentation.csproj
      
      - name: Perform unit tests
        run: |
          dotnet test PutWiki.slnx \
          --configuration Release \
          --no-restore \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage
  
  ci-status:
    needs: [client-verification, server-verification]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        run: |
          CLIENT_RESULT="${{ needs.client-verification.result }}"
          SERVER_RESULT="${{ needs.server-verification.result }}"
          
          if [[ "$CLIENT_RESULT" == "failure" || "$CLIENT_RESULT" == "cancelled" || \
                "$SERVER_RESULT" == "failure" || "$SERVER_RESULT" == "cancelled" ]]
          then
            echo "At least one of the jobs was cancelled or failed."
            exit 1
          else
            echo "All jobs passed or were skipped."
            exit 0
          fi
