name: CD pipeline (client)

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - "client/**"
            # Changes only to these files don't trigger CD:
            # docs
            - "!client/**/*.md"
            # unit tests and related config
            - "!client/**/*.test.*"
            - "!client/**/*.spec.*"
            - "!client/**/__tests__/**"
            - "!client/vitest.config.*"
            # storybook
            - "!client/**/*.stories.*"
            - "!client/.storybook/**"
            # msw
            - "!client/**/mocks/**"
            - "!client/**/__mocks__/**"
            # linter, formatter
            - "!client/.eslint*"
            - "!client/eslint.config.*"
            - "!client/.prettier*"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    packages: write

jobs:
    release-client:
        runs-on: ubuntu-22.04-arm

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Determine next version
              id: next_version
              uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DEFAULT_BUMP: patch
                  INITIAL_VERSION: 0.1.2
                  TAG_PREFIX: client-v
                  DRY_RUN: true

            - name: Login to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup QEMU
              uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Set lowercase repository name
              run: |
                echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

            - name: Build and push client image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: ./client
                  platforms: linux/arm64
                  push: true
                  tags: |
                      ghcr.io/${{ env.REPO }}/client:${{ steps.next_version.outputs.new_tag }}
                      ghcr.io/${{ env.REPO }}/client:latest

            - name: Create tag
              uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CUSTOM_TAG: ${{ steps.next_version.outputs.new_tag }}

            - name: Create GitHub Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ steps.next_version.outputs.new_tag }}
                  name: Release ${{ steps.next_version.outputs.new_tag }}
                  generate_release_notes: true
